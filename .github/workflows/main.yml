name: Deploy ACI

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: FireCAD
  LOCATION: eastus
  ACR_NAME: firemepregistry
  ACR_LOGIN_SERVER: firemepregistry.azurecr.io
  IMAGE_NAME: firecad-api
  CONTAINER_GROUP_NAME: firecad-api
  ACR_PULL_ID: /subscriptions/e1e67928-a190-494d-9ec7-2b8d97669e93/resourceGroups/FireCAD/providers/Microsoft.ManagedIdentity/userAssignedIdentities/firecad-identity

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name $ACR_NAME

      - name: Build and push image
        run: |
          docker build -f api/Dockerfile -t $ACR_LOGIN_SERVER/$IMAGE_NAME:${GITHUB_SHA} .
          docker push $ACR_LOGIN_SERVER/$IMAGE_NAME:${GITHUB_SHA}

      - name: Delete existing container group if present
        run: |
          az container delete \
            --resource-group $RESOURCE_GROUP \
            --name $CONTAINER_GROUP_NAME \
            --yes || true

      - name: Create ACI
        run: |
          az container create \
            --resource-group $RESOURCE_GROUP \
            --name $CONTAINER_GROUP_NAME \
            --location $LOCATION \
            --image $ACR_LOGIN_SERVER/$IMAGE_NAME:${GITHUB_SHA} \
            --assign-identity $ACR_PULL_ID \
            --acr-identity $ACR_PULL_ID \
            --ip-address Public \
            --dns-name-label ${CONTAINER_GROUP_NAME} \
            --ports 80 8000\
            --os-type Linux \
            --cpu 1 \
            --memory 1.5 \
            --environment-variables \
              API_HOST=0.0.0.0 \
              API_PORT=8000 \
              DATA_DIR=/data \
              ODA_PATH=/opt/oda/ODAFileConverter \
              TARGET_LONG_SIDE_PX=6000 \
              DPI=600 \
              RENDER_MAX_MEGAPIXELS=25 \
              USE_QCAD_DWG2BMP=1 \
              QCAD_HIGH_QUALITY=1 \
              QCAD_MARGIN_PX=4 \
              QCAD_DEFAULT_WIDTH_PX=24000 \
              QCAD_DEFAULT_HEIGHT_PX=16000 \
              QCAD_JPEG_QUALITY=95 \
              QCAD_FLATTEN_WHITE=1 \
              PAD_FRAC=0.01 \
              DETECTOR_SPACING_M=5.0 \
              WALL_BUFFER_M=0.5 \
            --secure-environment-variables \
              GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
