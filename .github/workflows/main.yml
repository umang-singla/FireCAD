name: Deploy ACI

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: FireCAD
  LOCATION: eastus
  ACR_NAME: firecadregistry
  ACR_LOGIN_SERVER: firecadregistry.azurecr.io
  IMAGE_NAME: firecad-api
  CONTAINER_GROUP_NAME: firecad-api
  ACR_PULL_ID: /subscriptions/11fa53d4-8489-49f7-8076-1c1cea18c2e1/resourceGroups/FireCAD/providers/Microsoft.ManagedIdentity/userAssignedIdentities/firecad-identity

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name $ACR_NAME

      - name: Build and push image
        run: |
          docker build -f app/Dockerfile -t firecadregistry.azurecr.io/firecad-api:${GITHUB_SHA} .
          docker push $ACR_LOGIN_SERVER/$IMAGE_NAME:${GITHUB_SHA}

      - name: Delete existing container group if present
        run: |
          az container delete \
            --resource-group $RESOURCE_GROUP \
            --name $CONTAINER_GROUP_NAME \
            --yes || true

      - name: Create ACI
        run: |
          az container create \
            --resource-group $RESOURCE_GROUP \
            --name $CONTAINER_GROUP_NAME \
            --location $LOCATION \
            --image $ACR_LOGIN_SERVER/$IMAGE_NAME:${GITHUB_SHA} \
            --assign-identity $ACR_PULL_ID \
            --acr-identity $ACR_PULL_ID \
            --ip-address Public \
            --dns-name-label ${CONTAINER_GROUP_NAME}-${GITHUB_RUN_NUMBER} \
            --ports 80 8000\
            --os-type Linux \
            --cpu 1 \
            --memory 1.5
