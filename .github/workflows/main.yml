name: Build and Deploy FireCAD to ACI

on:
  push:
    branches:
      - main # Change this if your main working branch is named differently

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    # 1. Grab your latest code
    - name: Checkout GitHub Action
      uses: actions/checkout@v3

    # 2. Log into your Azure account
    - name: Login via Azure CLI
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    # 3. Log into your Container Registry
    - name: Login to Azure Container Registry
      uses: azure/docker-login@v1
      with:
        login-server: ${{ secrets.REGISTRY_LOGIN_SERVER }}
        username: ${{ secrets.REGISTRY_USERNAME }}
        password: ${{ secrets.REGISTRY_PASSWORD }}

    # 4. Build the Docker image and push it to the registry
    - name: Build and push Docker image
      run: |
        docker build . -t ${{ secrets.REGISTRY_LOGIN_SERVER }}/firecad-api:${{ github.sha }}
        docker push ${{ secrets.REGISTRY_LOGIN_SERVER }}/firecad-api:${{ github.sha }}

    # 5. Tell the Container Instance to pull the new image and restart
    - name: Deploy to Azure Container Instances
      uses: azure/aci-deploy@v1
      with:
        resource-group: FireCAD
        name: firecad-api
        image: ${{ secrets.REGISTRY_LOGIN_SERVER }}/firecad-api:${{ github.sha }}
        registry-login-server: ${{ secrets.REGISTRY_LOGIN_SERVER }}
        registry-username: ${{ secrets.REGISTRY_USERNAME }}
        registry-password: ${{ secrets.REGISTRY_PASSWORD }}
        location: eastus
