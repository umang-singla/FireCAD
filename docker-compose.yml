services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    mem_limit: 3g
    environment:
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
      DATA_DIR: ${DATA_DIR:-/data}
      ODA_PATH: ${ODA_PATH:-/opt/oda/ODAFileConverter}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_IMAGE_MODEL: ${GEMINI_IMAGE_MODEL:-gemini-2.5-flash-image}

      # ✅ ADD THIS LINE (for login JWT tokens)
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}

      TARGET_LONG_SIDE_PX: ${TARGET_LONG_SIDE_PX:-6000}
      DPI: ${DPI:-600}
      RENDER_MAX_MEGAPIXELS: ${RENDER_MAX_MEGAPIXELS:-25}
      QCAD_DWG2BMP: ${QCAD_DWG2BMP:-/opt/qcad/dwg2bmp}
      USE_QCAD_DWG2BMP: ${USE_QCAD_DWG2BMP:-1}
      QCAD_HIGH_QUALITY: ${QCAD_HIGH_QUALITY:-1}
      QCAD_MARGIN_PX: ${QCAD_MARGIN_PX:-4}
      QCAD_INPUT_UNIT: ${QCAD_INPUT_UNIT:-}
      QCAD_LTSCALE: ${QCAD_LTSCALE:-}
      QCAD_RESOLUTION: ${QCAD_RESOLUTION:-}
      QCAD_WIDTH_PX: ${QCAD_WIDTH_PX:-24000}
      QCAD_HEIGHT_PX: ${QCAD_HEIGHT_PX:-16000}
      QCAD_DEFAULT_WIDTH_PX: ${QCAD_DEFAULT_WIDTH_PX:-24000}
      QCAD_DEFAULT_HEIGHT_PX: ${QCAD_DEFAULT_HEIGHT_PX:-16000}
      QCAD_JPEG_QUALITY: ${QCAD_JPEG_QUALITY:-95}
      QCAD_FLATTEN_WHITE: ${QCAD_FLATTEN_WHITE:-1}
      PAD_FRAC: ${PAD_FRAC:-0.01}
      DETECTOR_SPACING_M: ${DETECTOR_SPACING_M:-5.0}
      WALL_BUFFER_M: ${WALL_BUFFER_M:-0.5}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
      # QCAD is already baked into the image via COPY in Dockerfile.
      # Do NOT mount over /opt/qcad — it shadows the image contents
      # and breaks execution on Azure/cloud where the host path is absent.
      # Uncomment below ONLY for local dev to avoid rebuilds:
      # - ./qcad-3.32.6-trial-linux-x86_64:/opt/qcad:ro

  proxy:
    build:
      context: .
      dockerfile: proxy/Dockerfile
    environment:
      PROXY_HOST: "0.0.0.0"
      PROXY_PORT: "8080"
      PROXY_TIMEOUT: ${PROXY_TIMEOUT:-120}
      PROXY_DEFAULT_TARGET: ${PROXY_DEFAULT_TARGET:-http://api:8000}
      PROXY_TARGETS: ${PROXY_TARGETS:-'{"api":"http://api:8000"}'}
    ports:
      - "8080:8080"
    depends_on:
      - api

  web:
    build: ./web
    environment:
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8000}
      NEXT_PUBLIC_WS_BASE: ${NEXT_PUBLIC_WS_BASE:-http://localhost:8080}
    ports:
      - "3000:3000"
    depends_on:
      - api