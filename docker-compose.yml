services:
  api:
    build: ./api
    environment:
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
      DATA_DIR: ${DATA_DIR:-/data}
      ODA_PATH: ${ODA_PATH:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_IMAGE_MODEL: ${GEMINI_IMAGE_MODEL:-gemini-2.5-flash-image}
      TARGET_LONG_SIDE_PX: ${TARGET_LONG_SIDE_PX:-12000}
      DPI: ${DPI:-600}
      PAD_FRAC: ${PAD_FRAC:-0.01}
      DETECTOR_SPACING_M: ${DETECTOR_SPACING_M:-5.0}
      WALL_BUFFER_M: ${WALL_BUFFER_M:-0.5}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data

  web:
    build: ./web
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
